<!--
  Do not ship this as a standalone node. On its own an OfferCatalog says
  nothing about whose services these are. Reference it from the business or
  organization node so the graph connects:

    "hasOfferCatalog": { "@id": "{{CANONICAL_URL}}#offer-catalog" }

  Also give each Service a "provider" pointing at the business @id if the
  catalog is emitted as a separate script rather than nested inline.
-->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "OfferCatalog",
  "@id": "{{CANONICAL_URL}}#offer-catalog",
  "name": "{{OFFER_CATALOG_NAME}}",
  "itemListElement": [
    {
      "@type": "Offer",
      "itemOffered": {
        "@type": "Service",
        "name": "{{SERVICE_NAME_1}}",
        "description": "{{SERVICE_DESCRIPTION_1}}",
        "areaServed": {
          "@type": "Place",
          "name": "{{SERVICE_AREA_1}}"
        }
      }
    },
    {
      "@type": "Offer",
      "itemOffered": {
        "@type": "Service",
        "name": "{{SERVICE_NAME_2}}",
        "description": "{{SERVICE_DESCRIPTION_2}}",
        "areaServed": {
          "@type": "Place",
          "name": "{{SERVICE_AREA_2}}"
        }
      }
    }
  ]
}
</script>
