<!-- SearchAction powered Google's sitelinks search box, retired 2024-11-21. -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "@id": "{{CANONICAL_URL}}#website",
  "url": "{{CANONICAL_URL}}",
  "name": "{{SITE_NAME}}",
  "alternateName": [
    "{{ALTERNATE_SITE_NAME_1}}",
    "{{ALTERNATE_SITE_NAME_2}}"
  ],
  "publisher": {
    "@id": "{{CANONICAL_URL}}#publisher"
  },
  "inLanguage": ["{{LANGUAGE_1}}", "{{LANGUAGE_2}}"],
  "potentialAction": {
    "@type": "SearchAction",
    "target": "{{SEARCH_URL_TEMPLATE}}",
    "query-input": "required name=search_term_string"
  }
}
</script>
