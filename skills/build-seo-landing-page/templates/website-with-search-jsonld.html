<!--
  Legacy template. The SearchAction block below powered Google's sitelinks
  search box, which Google retired on November 21, 2024. It no longer produces
  any Google Search feature.

  Prefer templates/website-jsonld.html for new pages. Use this only when a site
  has real site search and the SearchAction is wanted for non-Google consumers.
-->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "@id": "{{CANONICAL_URL}}#website",
  "url": "{{CANONICAL_URL}}",
  "name": "{{SITE_NAME}}",
  "alternateName": [
    "{{ALTERNATE_SITE_NAME_1}}",
    "{{ALTERNATE_SITE_NAME_2}}"
  ],
  "publisher": {
    "@id": "{{CANONICAL_URL}}#publisher"
  },
  "inLanguage": ["{{LANGUAGE_1}}", "{{LANGUAGE_2}}"],
  "potentialAction": {
    "@type": "SearchAction",
    "target": "{{SEARCH_URL_TEMPLATE}}",
    "query-input": "required name=search_term_string"
  }
}
</script>
