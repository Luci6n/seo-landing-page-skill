<!--
  Use only when these questions and answers are visibly on the page.
  Note: the FAQ rich result was removed from Google Search on 2026-05-07.
  FAQPage is still worth including so assistants and answer engines can
  parse the Q&A, but it no longer produces a Google search feature.
-->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "inLanguage": "{{LANGUAGE}}",
  "@id": "{{CANONICAL_URL}}#faq",
  "mainEntity": [
    {
      "@type": "Question",
      "name": "{{QUESTION_1}}",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "{{ANSWER_1}}"
      }
    },
    {
      "@type": "Question",
      "name": "{{QUESTION_2}}",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "{{ANSWER_2}}"
      }
    }
  ]
}
</script>
