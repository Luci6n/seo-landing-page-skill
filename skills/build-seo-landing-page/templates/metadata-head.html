<!-- Replace placeholders before use. -->
<title>{{PAGE_TITLE}}</title>
<meta name="description" content="{{META_DESCRIPTION}}" />
<meta name="robots" content="index, follow, max-image-preview:large" />
<meta name="theme-color" content="{{THEME_COLOR}}" />
<meta name="apple-mobile-web-app-title" content="{{SHORT_SITE_NAME}}" />
<meta name="application-name" content="{{SHORT_SITE_NAME}}" />
<meta name="author" content="{{AUTHOR_OR_BUSINESS_NAME}}" />

<meta property="og:type" content="{{OG_TYPE}}" />
<meta property="og:url" content="{{CANONICAL_URL}}" />
<meta property="og:title" content="{{OG_TITLE}}" />
<meta property="og:site_name" content="{{SITE_NAME}}" />
<meta property="og:description" content="{{OG_DESCRIPTION}}" />
<meta property="og:image" content="{{OG_IMAGE_URL}}" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:locale" content="{{OG_LOCALE}}" />

<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="{{TWITTER_TITLE}}" />
<meta name="twitter:description" content="{{TWITTER_DESCRIPTION}}" />
<meta name="twitter:image" content="{{OG_IMAGE_URL}}" />

<link rel="canonical" href="{{CANONICAL_URL}}" />
<!-- Google Search does not support SVG favicons; keep a PNG or ICO alongside it. -->
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="icon" type="image/png" sizes="96x96" href="/favicon.png" />
<link rel="shortcut icon" href="/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<link rel="manifest" href="/site.webmanifest" />

<!-- Optional. Google ignores geo meta tags; Bing still references them. -->
<meta name="geo.region" content="{{GEO_REGION}}" />
<meta name="geo.placename" content="{{GEO_PLACENAME}}" />
